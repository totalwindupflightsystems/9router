description = "Weekly documentation pass — research-driven doc refresh; injects DOC- tasks into project boards; no-op when git history is quiet"
default_prompt = '''You are the weekly doc-writer tick. Today: note UTC date. For EACH enabled fleet project listed in ~/.hermes/fleet.toml [[projects]] (namespace_id coding-hermes or pm, workdir exists locally): (1) BASELINE — read <workdir>/.coding-hermes/board/events.jsonl and find the most recent event whose detail mentions doc-writer or a DOC- task id; its timestamp is the last doc pass. No such event = look back 30 days. (2) ACTIVITY CHECK — `git -C <workdir> log --oneline --since=<baseline>`; zero meaningful commits (excluding board chore commits touching .coding-hermes) means NOTHING TO DO for that project — skip silently. (3) RESEARCH — for projects with activity: scan the new commits and diffstats for undocumented features/changes; you are ENCOURAGED to do your own web research on new concepts/libraries introduced; cross-check each candidate doc topic against the actual git history (file:line evidence) before filing. (4) INJECT — file at most 3 DOC-<N> task rows per board (priority P3, complexity 3, status pending, title carries the evidence, reasoning field carries file:line + why now). Use boardctl if on PATH (boardctl -C <workdir> create ...) else the JSONL append recipe from skill coding-hermes-jsonl-board-append (append-only, parsed-id dedupe — never substring matching, mirror the last row schema, commit + push with co-author trailer). (5) Append one audit event per board you touched with detail {"doc_writer_run":"<UTC date>","injected":[ids]} so next week has its baseline. (6) Report: per-project one-liner (injected / skipped-quiet / skipped-up-to-date). If every project is quiet, report exactly that — an idle clean tick is a SUCCESS. Never rewrite whole JSONL files; never inject into boards you cannot push to.'''

