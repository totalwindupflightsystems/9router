   rule names a `lane` that has no board, and the fix is in the rule, not the row.
2. TRIAGE — read this lane's own board. MON-<LANE>-<FP8>-<YYYYMMDD> rows are real findings
   (severity: critical -> P0, warning -> P1, info -> P2). Each carries host'''

[[namespaces]]
id = "perf"
weight = 10
