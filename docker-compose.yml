# Standalone deployment. The image reads its secrets from `.env` — copy
# .env.example to .env first (`cp .env.example .env`) and set real values
# for INITIAL_PASSWORD / JWT_SECRET / API_KEY_SECRET (see README).
# `.env` is intentionally OPTIONAL at config time (required: false) so a
# fresh clone validates with `docker compose config`; without it the
# container falls back to insecure image defaults. Requires Docker Compose
# v2.24+ for the optional env_file syntax.
services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
