guards:
  secrets: true
  lint: false
  tests: true
  test_mode: full
  test_command: ./scripts/gitreins-guard-tests.sh
  static_analysis: false
evaluator:
  model: deepseek-v4-flash
  max_iterations: 100
  max_time: "30m"
  max_input_tokens: "1M"
  max_output_tokens: "384k"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
pipeline:
  stages:
    # Mirrors guards policy: secrets + regression-gate tests, NO lint
    # (guards.lint: false — repo has pre-existing eslint warnings). The
    # built-in workdir secrets scanner false-positives on 4 upstream
    # placeholder lines (providers/registry, oauth constants, mitm) —
    # gitleaks (repo scanner, clean) is the authoritative check.
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: secrets
          type: script
          run: "if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --source . --no-git --no-banner; else true; fi"
          on_fail: continue
        - id: tests
          type: script
          run: ./scripts/gitreins-guard-tests.sh
          timeout: 600
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: -1
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]
