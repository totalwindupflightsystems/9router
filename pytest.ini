[pytest]
# Scopes the harness-venv pytest suite to the trees that are MEANT to run
# under it (QA-GUARD-005 guard unblock, 2026-10-20). Without testpaths, a
# bare `pytest` from $HOME — which the gitreins guard's default
# test_command (pytest -x --tb=short) is — recursed into EVERY project on
# the box and died at the first foreign collection error (RyzenAI-SW's
# onnxruntime/cv2 imports, Kobayashi-Maru's missing numpy, DAGger demo's
# GATEWAY_API_KEY sys.exit-at-import). Those files are not this repo's
# suite; the guard's full mode now runs the runnable set instead of
# stopping the box at an arbitrary foreign import.
testpaths =
    Kobayashi-Maru/tests
    Hermes-DAGger/hermes-dagger/demo
