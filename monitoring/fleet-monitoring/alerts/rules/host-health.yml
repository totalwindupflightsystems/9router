# fleet-monitoring — host health rules.
#
# Every rule carries `lane`, which the alert-router turns into a board row on that project.
# A rule with no lane still lands (on the catch-all `monitoring` lane) rather than vanishing —
# but name an owner, or nobody owns the fix.
#
# Hosts PUSH their metrics here, so "is the host up" is not `up == 0` (there is nothing to
# scrape): it is staleness — how long since this host last sent a sample.

groups:
  - name: host-health
    interval: 30s
    rules:
      - alert: HostNotReporting
        # timestamp() of the newest sample; node_boot_time is a stable, always-present series
        expr: |
          time() - max by (host, environment) (timestamp(node_boot_time_seconds)) > 300
        for: 5m
        labels:
          severity: critical
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} has stopped reporting"
          description: |
            No metrics from {{ $labels.host }} for over 5 minutes. Either the host is down, the
            Alloy agent is stopped, or the tailnet path to the monitoring host is broken.
            Check, in order: `ssh {{ $labels.host }} systemctl status alloy`,
            `tailscale status`, then the host's console.
          runbook: docs/runbook.md#host-not-reporting

      # HostJustCameBack was REMOVED on purpose, not by omission. The obvious expression
      # (compare "fresh now" against an offset selector) cannot work: a host that was down
      # 15 minutes ago has NO sample at that offset, so `and on(host) <offset vector>` matches
      # nothing and the alert can never fire — it would look correct and be dead.
      #
      # The recovery signal already exists thanklessly: HostNotReporting CLEARING is a
      # resolution, Alertmanager posts it, and the alert-router writes an event to the lane's
      # events.jsonl. One mechanism, and it cannot silently never fire.

      - alert: HighLoadPerCore
        expr: |
          (node_load1 / on(host) count by (host) (node_cpu_seconds_total{mode="idle"})) > 4
        for: 15m
        labels:
          severity: warning
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} load {{ $value | printf \"%.1f\" }} per core"
          description: |
            Sustained load above 4 per core for 15m. On this fleet that is usually an orphaned
            burn loop rather than real work — check for stray processes before adding capacity.

      - alert: MemoryPressureHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.92
        for: 15m
        labels:
          severity: warning
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} memory {{ $value | humanizePercentage }} used"
          description: "Memory above 92% for 15m. Check for a container sizing change or a leak."

      - alert: OOMKillsOccurring
        expr: delta(node_vmstat_oom_kill[15m]) > 0 and (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 0m
        labels:
          severity: critical
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} OOM-killed a process while memory was low"
          description: |
            {{ $value }} OOM kill(s) in the last 15m with MemAvailable <15%. This looks like a real
            host-level memory exhaustion — find the victim before the next one takes down a service.
      - alert: OOMKillsLowPressure
        expr: delta(node_vmstat_oom_kill[15m]) > 0 and (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) >= 0.15
        for: 0m
        labels:
          severity: warning
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} OOM-killed a process but memory pressure is low"
          description: |
            {{ $value }} OOM kill(s) in the last 15m while the host still had >=15% MemAvailable.
            Likely cgroup-scoped kills (CI test suites, memcg limits), NOT host exhaustion.
            Scope-check: ssh to the host and run dmesg -T | grep oom-kill — if constraint=CONSTRAINT_MEMCG
            with an expected test memcg, this is benign and will clear on its own.

      - alert: ClockSkewDetected
        expr: abs(node_timex_offset_seconds) > 2
        for: 10m
        labels:
          severity: warning
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} clock is skewed by {{ $value | printf \"%.1f\" }}s"
          description: "Skew >2s breaks token validation, TLS and log correlation. Check chrony/ntpd."
      # MON-MONITORING-LOGIND-20261014: bunker hosts can be up (disk OK, RAM OK, API
      # answering) while systemd-logind is wedged — every agent spawn dies at
      # "enable linger". bunker-health.sh textfile exporter publishes logind liveness
      # and the 30m spawn-failure count from the bunkerd journal.
      - alert: BunkerLogindWedge
        expr: bunker_logind_up == 0
        for: 5m
        labels:
          severity: critical
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} systemd-logind D-Bus is wedged"
          description: |
            busctl introspect org.freedesktop.login1 timed out on {{ $labels.host }}.
            All agent spawns fail at "enable linger" even though the host looks healthy.
            Fix: ssh {{ $labels.host }} "systemctl restart systemd-logind" (verified 2026-10-14).
          runbook: docs/runbook.md#bunkerlogindwedge

      - alert: BunkerSpawnFailures
        expr: bunker_spawn_failures_30m > 0
        for: 0m
        labels:
          severity: warning
          lane: monitoring
        annotations:
          summary: "{{ $labels.host }} had {{ $value }} spawn failures in 30m"
          description: |
            bunkerd logged "enable linger"/"spawn failed" lines in the last 30m window.
            Early signal for the logind wedge class: check bunker_logind_up on the same
            host; if 0, restart systemd-logind (MON-MONITORING-LOGIND-20261014).
          runbook: docs/runbook.md#bunkerspawnfailures
